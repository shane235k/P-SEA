{% extends 'base.html' %}

{% block title %}Create Group - SplitAudit{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card glass-card p-4 border-0">
            <h3 class="mb-3 text-dark"><i class="bi bi-plus-circle text-primary me-2"></i> Create New Expense Group</h3>
            <p class="text-secondary small">Groups allow you to isolate expenses, settlements, and imports for a specific cohort (e.g. Flatmates, Trips).</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold text-secondary">Group Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Goa Trip 2026, Flat 402" required>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary-grad px-4">
                        <i class="bi bi-check-lg"></i> Create Group
                    </button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
